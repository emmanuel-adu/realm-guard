<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Realm Guard: check n8n workflows stay inside each client's books</title>
    <meta name="description" content="Drop an exported n8n workflow and your client list. Realm Guard flags shared QuickBooks credentials, unpinned company IDs, cross-client state and writes nobody approves. Runs in your browser." />
    <meta property="og:title" content="Realm Guard" />
    <meta property="og:description" content="Check an n8n workflow stays inside each client's QuickBooks books before it runs." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='3' width='26' height='26' rx='6' fill='%230f172a'/%3E%3Crect x='17' y='7' width='8' height='18' rx='2' fill='%23ffffff'/%3E%3C/svg%3E" />
    <script>
      // Runs before first paint so the saved or system theme never flashes the wrong colors.
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem("rg-theme");
        } catch (e) {}
        if (theme !== "light" && theme !== "dark") {
          theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Realm Guard scans workflows in your browser, so it needs JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
